# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
  - code-quality
  - test
  - secret-detection
  - create-mr

pint_style_check:
  stage: code-quality
  image: php:8.4-cli
  before_script:
    - apt-get update && apt-get install -y unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist --optimize-autoloader
  script:
    - vendor/bin/pint --test

larastan_analysis:
  stage: code-quality
  image: php:8.4-cli
  before_script:
    - apt-get update && apt-get install -y unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist --optimize-autoloader
  script:
    - vendor/bin/phpstan analyse --memory-limit=2G

sast:
  stage: test
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection

unit_test:
  stage: test
  image: php:8.4-cli
  variables:
    DB_CONNECTION: sqlite
    DB_DATABASE: database/database.sqlite
    APP_ENV: testing
    APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=
    CACHE_DRIVER: array
    SESSION_DRIVER: array
    QUEUE_CONNECTION: sync
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - vendor/
  before_script:
    - apt-get update -yqq && apt-get install -yqq git sqlite3 libsqlite3-dev unzip nodejs npm
    - docker-php-ext-install bcmath
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist --optimize-autoloader
    - npm ci
    - npm run build
    - touch database/database.sqlite
    - php artisan migrate
  script:
    - vendor/bin/pest

create_mr_to_dev:
  stage: create-mr
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      echo "Mengecek apakah Merge Request sudah ada..."
      EXISTING_MR=$(curl -s --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests?state=opened&source_branch=${CI_COMMIT_BRANCH}&target_branch=dev")
      if [ "$(echo $EXISTING_MR | jq 'length')" -eq "0" ]; then
        echo "Membuat Merge Request ke branch dev..."
        curl -X POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests" \
             --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
             --data "source_branch=${CI_COMMIT_BRANCH}" \
             --data "target_branch=dev" \
             --data "title=Merge ${CI_COMMIT_BRANCH} to dev" \
             --data "remove_source_branch=true"
      else
        echo "Merge Request sudah ada."
      fi
  rules:
    # Hanya buat MR otomatis dari branch feature, bugfix, chore, dan test
    - if: '$CI_COMMIT_BRANCH =~ /^(feature|bugfix|chore|test)\//'

auto_merge_dev_to_qa:
  stage: create-mr
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      echo "Mencari MR yang sudah terbuka dari dev ke qa..."
      EXISTING_MR=$(curl -s --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests?state=opened&source_branch=dev&target_branch=qa")
      
      MR_IID=""
      if [ "$(echo $EXISTING_MR | jq 'length')" -gt "0" ]; then
        MR_IID=$(echo $EXISTING_MR | jq -r '.[0].iid')
        echo "Ditemukan MR #$MR_IID yang sudah ada."
      else
        echo "Membuat Merge Request baru..."
        CREATE_MR_RES=$(curl -s -X POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests" \
             --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
             --data "source_branch=dev" \
             --data "target_branch=qa" \
             --data "title=Auto-Merge dev to qa" \
             --data "remove_source_branch=false")
        MR_IID=$(echo $CREATE_MR_RES | jq -r '.iid')
      fi
      
      if [ "$MR_IID" != "null" ] && [ -n "$MR_IID" ]; then
        echo "Mengaktifkan Auto-Merge (Accept) untuk MR #$MR_IID..."
        MERGE_RES=$(curl -s -X PUT "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/merge" \
             --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
             --data "merge_when_pipeline_succeeds=true")
        
        if echo "$MERGE_RES" | grep -q '405\|406\|cannot be merged\|Method Not Allowed'; then
             echo "Fallback: Opsi tunggu pipeline ditolak. Mencoba merge instan..."
             MERGE_RES=$(curl -s -X PUT "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/merge" \
                  --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}")
        fi
        echo "Respon Merge Akhir: $MERGE_RES"
      else
        echo "Gagal membuat atau mengambil MR. Periksa error."
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE != "schedule"'

scheduled_merge_qa_to_main:
  stage: create-mr
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      echo "Mencari MR yang sudah terbuka dari qa ke main..."
      EXISTING_MR=$(curl -s --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests?state=opened&source_branch=qa&target_branch=main")
      
      MR_IID=""
      if [ "$(echo $EXISTING_MR | jq 'length')" -gt "0" ]; then
        MR_IID=$(echo $EXISTING_MR | jq -r '.[0].iid')
        echo "Ditemukan MR #$MR_IID yang sudah ada."
      else
        echo "Membuat Merge Request baru..."
        CREATE_MR_RES=$(curl -s -X POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests" \
             --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
             --data "source_branch=qa" \
             --data "target_branch=main" \
             --data "title=Weekly Auto-Release qa to main" \
             --data "remove_source_branch=false")
        MR_IID=$(echo $CREATE_MR_RES | jq -r '.iid')
      fi
      
      if [ "$MR_IID" != "null" ] && [ -n "$MR_IID" ]; then
        echo "Mengaktifkan Auto-Merge (Accept) untuk MR #$MR_IID..."
        MERGE_RES=$(curl -s -X PUT "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/merge" \
             --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
             --data "merge_when_pipeline_succeeds=true")
        
        if echo "$MERGE_RES" | grep -q '405\|406\|cannot be merged\|Method Not Allowed'; then
             echo "Fallback: Opsi tunggu pipeline ditolak. Mencoba merge instan..."
             MERGE_RES=$(curl -s -X PUT "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/merge" \
                  --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}")
        fi
        echo "Respon Merge Akhir: $MERGE_RES"
      else
        echo "Gagal membuat atau mengambil MR. Periksa error."
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
